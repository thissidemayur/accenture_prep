<!doctype html>
<html>
  <head>
    <title>Employee Dashboard</title>
  </head>
  <body>
    <h1>Employee Management</h1>

    <form id="employeeForm">
      <input type="text" name="name" placeholder="Employee name" />

      <input type="email" name="email" placeholder="Employee email" />

      <select name="department">
        <option value="">Select Department</option>
        <option value="Engineering">Engineering</option>
        <option value="HR">HR</option>
        <option value="Sales">Sales</option>
        <option value="Finance">Finance</option>
      </select>

      <input type="number" name="salary" placeholder="Salary" />

      <button type="submit">Add Employee</button>
    </form>

    <hr />
 <hr /> <hr />
 
    <input type="text" id="searchInput" placeholder="Search employee..." />

    <select id="departmentFilter">
      <option value="all">All Departments</option>
      <option value="Engineering">Engineering</option>
      <option value="HR">HR</option>
      <option value="Sales">Sales</option>
      <option value="Finance">Finance</option>
    </select>

    <select id="sortFilter">
      <option value="none">Sort By</option>
      <option value="salaryHigh">Salary: High → Low</option>
      <option value="salaryLow">Salary: Low → High</option>
      <option value="nameAZ">Name: A → Z</option>
    </select>

    <button id="loadBtn">Load Employees From API</button>

    <p id="status"></p>

    <p id="error"></p>

    <ul id="employeeList"></ul>

    <script src="index.js" defer></script>
  </body>
</html>
