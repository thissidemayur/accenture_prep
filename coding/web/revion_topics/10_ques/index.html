<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="dropdown-container">
      <select id="fruit-select">
        <option value="">Select Fruit</option>
        <option value="Apple">Apple</option>
        <option value="Banana">Banana</option>
        <option value="Mango">Mango</option>
      </select>

      <button id="show-fruit">Show Selected</button>

      <p id="selected-fruit"></p>
    </div>

    <!--  -->
    <div class="container">
      <input id="student-name" type="text" placeholder="Student name" />

      <select id="student-course">
        <option value="">Select Course</option>
        <option value="CSE">CSE</option>
        <option value="ECE">ECE</option>
        <option value="ME">ME</option>
      </select>

      <button id="show-student">Show Student</button>

      <p id="student-result"></p>
    </div>

    <label>
      <input type="checkbox" id="terms" />
      I agree to the terms
    </label>

    <button id="submit-btn">Submit</button>

    <p id="message"></p>

    <script src="index.js"></script>
  </body>
</html>
