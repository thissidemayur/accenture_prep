<!-- 
Change background Color Using Dropdown 
- Create a dropDown with colors
- Change background color based on selected option
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Background Color Using Dropdown</title>
</head>
<body>
    <h3>Select Background Color</h3>
    <select id="changeBackgroundColor">
        <option value="">select</option>
        <option value="red">red</option>
        <option value="blue">blue</option>
        <option value="green">green</option>
        <option value="yellow">yellow</option>
        <option value="black">black</option>
    </select>

    <script>
        const bangroundChnage = document.querySelector("#changeBackgroundColor")
        bangroundChnage.addEventListener("change",(event)=>{
            const value = event.target.value
            if(!value) return
            document.body.style.backgroundColor=value
            console.log("value: ",value)
            if(value==="black") {
                document.body.style.color="white"
            }else{
                document.body.style.color="black"

            }
        })
    </script>
</body>
</html>
