```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Validation + Password Toggle + Live Character</title>

  <style>
    .success {
      color: green;
    }

    .error {
      color: red;
    }
  </style>
</head>
<body>

  <form id="registerForm">
    <input
      type="text"
      name="username"
      placeholder="Username"
    >

    <input
      type="email"
      name="email"
      id="email"
      placeholder="Email"
    >

    <input
      type="password"
      name="password"
      id="password"
      placeholder="Password"
    >

    <button type="button" id="togglePassword">
      Show Password
    </button>

    <p>Password length: <span id="charCount">0</span></p>

    <label>
      <input type="checkbox" name="terms">
      Accept terms
    </label>

    <button type="submit">Register</button>
  </form>

  <p id="message" role="alert"></p>

  <script>
    const form = document.querySelector("#registerForm");
    const passwordInput = document.querySelector("#password");
    const togglePassword = document.querySelector("#togglePassword");
    const charCount = document.querySelector("#charCount");
    const message = document.querySelector("#message");
    const emailInput = document.querySelector("#email");

    // Live password character counter
    passwordInput.addEventListener("input", () => {
      charCount.textContent = passwordInput.value.length;
    });

    // Toggle password visibility
    togglePassword.addEventListener("click", () => {
      const isHidden = passwordInput.type === "password";

      passwordInput.type = isHidden ? "text" : "password";
      togglePassword.textContent = isHidden
        ? "Hide Password"
        : "Show Password";
    });

    // Email validation without regex
    function isEmailFormatValid() {
      const emailStr = emailInput.value.trim();

      if (!emailStr || !emailInput.checkValidity()) {
        return false;
      }

      const parts = emailStr.split("@");

      // Exactly one @ symbol
      if (parts.length !== 2) return false;

      const atIndex = emailStr.indexOf("@");
      const dotIndex = emailStr.lastIndexOf(".");

      // Text must appear before @
      if (atIndex < 1) return false;

      // Text must appear between @ and .
      if (dotIndex <= atIndex + 1) return false;

      // At least two characters after the final dot
      if (dotIndex >= emailStr.length - 2) return false;

      return true;
    }

    // Form validation
    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const formData = new FormData(form);

      const username = formData.get("username").trim();
      const email = formData.get("email").trim();
      const password = formData.get("password");
      const termsAccepted = formData.get("terms") !== null;

      let error = "";

      if (username.length < 3) {
        error = "Username must contain at least 3 characters.";
      } else if (!email || !isEmailFormatValid()) {
        error = "Please enter a valid email address.";
      } else if (password.length < 8) {
        error = "Password must be at least 8 characters.";
      } else if (!termsAccepted) {
        error = "You must accept the terms.";
      }

      message.textContent = error || "Registration successful!";

      message.classList.toggle("error", Boolean(error));
      message.classList.toggle("success", !error);
    });
  </script>

</body>
</html>
```

<!-- 
Problem statement
Create a registration form with these rules:
1. Username must contain at least 3 characters.
2. Email must have a valid-looking format.
3. Password must be at least 8 characters.
4. The user must accept the terms checkbox.
5. A button toggles password visibility.
6. A live counter shows password length.
7. Show validation errors without reloading the page.
-->
